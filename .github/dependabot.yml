version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # satori after 0.35.0 fails the build ("__dirname is not defined" in its ESM bundle).
      # It's pinned; upgrade it by hand once a fixed release is out.
      - dependency-name: satori
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
