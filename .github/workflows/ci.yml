name: CI

# Every pull request and push to main installs from the lockfile, runs the API tests, and runs a full production build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Astro 7.4 needs Node 22.23.4 or newer; check-latest makes sure the runner's cached 22 isn't older.
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
